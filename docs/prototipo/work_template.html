<style>

</style>
<style>
/* ======== Acréscimos do protótipo (prefixo pt-) ======== */
.pt-faixa { position:sticky; top:0; z-index:80; background:repeating-linear-gradient(135deg,#8a5f0d 0 14px,#96681a 14px 28px); color:#fff; font:600 12.5px/1.3 var(--sans); padding:7px 16px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.pt-faixa button { background:#fff; color:var(--navy); border:0; border-radius:6px; padding:5px 12px; font-weight:700; cursor:pointer; }
body.pt .sidebar { top:34px; height:calc(100vh - 34px); }
.nav a .pt-novo { margin-left:auto; background:var(--gold); color:var(--navy); font-size:9.5px; font-weight:800; letter-spacing:.06em; padding:2px 6px; border-radius:4px; }
.nav a .pt-badge { margin-left:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:700; min-width:18px; height:18px; border-radius:9px; display:inline-grid; place-items:center; padding:0 5px; }
.nav a .pt-badge + .pt-novo { margin-left:6px; }
#vista .abas { flex-wrap:wrap; }
.pt-novo-sel { display:inline-block; background:var(--gold); color:var(--navy); font-size:9.5px; font-weight:800; letter-spacing:.06em; padding:2px 6px; border-radius:4px; vertical-align:middle; }
.pt-voltar { display:inline-flex; align-items:center; gap:6px; background:none; border:0; padding:0; color:var(--navy); font-weight:600; cursor:pointer; margin:0 0 10px; font-size:13px; }
.pt-voltar:hover { text-decoration:underline; }
.pt-demo { border:2px dashed var(--gold) !important; }
.pt-demo-faixa { background:var(--gold); color:var(--navy); font-size:10.5px; font-weight:800; letter-spacing:.1em; padding:4px 10px; border-radius:6px; display:inline-block; margin-bottom:8px; }
.pt-aviso { background:var(--blue-soft); color:var(--blue); border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
.pt-aviso.ouro { background:var(--gold-soft); color:var(--gold-ink); }
.pt-toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:9px 16px; border-radius:8px; font-size:13px; z-index:90; box-shadow:0 8px 20px rgba(0,0,0,.2); }
.pt-pill { display:inline-block; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:20px; background:var(--gray-soft); color:var(--ink-2); white-space:nowrap; }
.pt-pill.verde { background:var(--green-soft); color:var(--green); } .pt-pill.azul { background:var(--blue-soft); color:var(--blue); } .pt-pill.ouro { background:var(--gold-soft); color:var(--gold-ink); }
/* ticker */
.pt-ticker { display:flex; background:var(--navy); color:#fff; border-radius:8px; overflow:hidden; margin:0 0 16px; height:38px; }
.pt-ticker .rot { background:var(--red); font-weight:800; font-size:11.5px; letter-spacing:.12em; padding:0 14px; display:flex; align-items:center; white-space:nowrap; }
.pt-ticker .janela { overflow:hidden; flex:1; position:relative; mask-image:linear-gradient(to right,transparent,#000 30px,#000 calc(100% - 30px),transparent); }
.pt-ticker .fita { display:flex; gap:42px; white-space:nowrap; position:absolute; top:0; height:38px; align-items:center; animation:pt-rolar 70s linear infinite; padding-left:100%; }
.pt-ticker:hover .fita { animation-play-state:paused; }
.pt-ticker .fita a { color:#fff; text-decoration:none; font-size:13px; cursor:pointer; } .pt-ticker .fita a b { color:var(--gold); margin-right:6px; }
.pt-ticker .fita a:hover { text-decoration:underline; }
@keyframes pt-rolar { from { transform:translateX(0); } to { transform:translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { .pt-ticker .fita { animation:none; padding-left:14px; } }
/* gráficos */
.pt-graficos { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.pt-graficos .largo { grid-column:1 / -1; }
.pt-graficos > * { min-width:0; }
.pt-colunas2 { columns:2; column-gap:28px; }
.pt-legenda { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:8px; }
.pt-legenda i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
.pt-hbar { display:grid; grid-template-columns:190px 1fr 92px; gap:10px; align-items:center; font-size:12.5px; margin:6px 0; }
.pt-hbar .trilho { height:12px; background:var(--gray-soft); border-radius:6px; overflow:hidden; display:flex; }
.pt-hbar .trilho i { display:block; height:100%; }
.pt-kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
/* agenda */
.pt-cal { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.pt-cal .dow { background:var(--paper); font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:7px; text-align:center; border-bottom:1px solid var(--line); }
.pt-cal .dia { min-height:96px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; background:#fff; cursor:pointer; min-width:0; }
.pt-cal .dia.fora { background:#fbfaf7; color:#b5ae9f; } .pt-cal .dia.hoje .num { background:var(--navy); color:#fff; border-radius:50%; }
.pt-cal .dia .num { display:inline-grid; place-items:center; width:24px; height:24px; font-size:12px; font-weight:600; }
.pt-ev { display:block; font-size:11px; border-radius:4px; padding:2px 5px; margin-top:3px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-left:3px solid; }
.pt-ev.legal { background:var(--red-soft); border-color:var(--red); color:#7b241c; } .pt-ev.meta { background:var(--blue-soft); border-color:var(--blue); color:var(--blue); }
.pt-ev.ata { background:var(--gold-soft); border-color:var(--gold); color:var(--gold-ink); }
.pt-dia-lista { display:flex; flex-direction:column; gap:8px; }
.pt-dia-lista .item { display:flex; gap:12px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; }
.pt-dia-lista .item:hover { border-color:var(--navy); }
/* mensagens */
.pt-msg { display:grid; grid-template-columns:300px 1fr; height:560px; background:#fff; overflow:hidden; border-radius:0 0 10px 10px; }
.pt-conversas { border-right:1px solid var(--line); overflow-y:auto; }
.pt-conversas .c { padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:10px; }
.pt-conversas .c:hover, .pt-conversas .c.ativa { background:var(--paper); }
.pt-av { width:34px; height:34px; border-radius:50%; background:var(--gold-soft); color:var(--gold-ink); display:grid; place-items:center; font-weight:700; font-size:12px; flex:none; }
.pt-thread { display:flex; flex-direction:column; min-width:0; }
.pt-thread .cab { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; }
.pt-thread .corpo { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:var(--paper); }
.pt-bolha { max-width:70%; padding:9px 13px; border-radius:12px; background:#fff; border:1px solid var(--line); font-size:13.5px; }
.pt-bolha.eu { align-self:flex-end; background:var(--navy); color:#fff; border-color:var(--navy); }
.pt-bolha .meta { font-size:10.5px; opacity:.7; margin-top:3px; }
.pt-thread form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
.pt-thread input[type=text] { flex:1; border:1px solid var(--line-2); border-radius:8px; padding:9px 12px; }
.pt-para { display:flex; flex-wrap:wrap; gap:6px; align-items:center; border:1px solid var(--line-2); border-radius:8px; padding:6px 8px; background:#fff; position:relative; }
.pt-para input { border:0; outline:0; flex:1; min-width:160px; padding:4px; }
.pt-chip { display:inline-flex; align-items:center; gap:6px; background:var(--blue-soft); color:var(--blue); font-weight:600; font-size:12.5px; padding:3px 8px; border-radius:14px; }
.pt-chip.grupo { background:var(--gold-soft); color:var(--gold-ink); }
.pt-chip button { border:0; background:none; cursor:pointer; color:inherit; font-weight:700; padding:0; }
.pt-sug { position:absolute; left:0; right:0; top:100%; margin-top:4px; background:#fff; border:1px solid var(--line-2); border-radius:8px; box-shadow:0 10px 24px rgba(22,40,77,.15); z-index:20; max-height:260px; overflow-y:auto; }
.pt-sug.acima { top:auto; bottom:100%; margin:0 0 4px; }
.pt-sug div { padding:8px 12px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; gap:10px; }
.pt-sug div:hover, .pt-sug div.sel { background:var(--paper); }
.pt-mencao { color:var(--gold-ink); font-weight:700; } .pt-bolha.eu .pt-mencao { color:#e0b45a; }
.pt-comp { padding:18px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
.pt-comp label.rot { font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:4px; }
.pt-comp textarea, .pt-comp select { width:100%; border:1px solid var(--line-2); border-radius:8px; padding:8px 10px; background:#fff; }
.pt-tip { position:fixed; z-index:95; max-width:320px; background:var(--navy); color:#fff; font-size:12.5px; line-height:1.45; padding:8px 11px; border-radius:8px; box-shadow:0 10px 24px rgba(0,0,0,.25); pointer-events:none; white-space:pre-line; }
.pt-tip b { color:var(--gold); }
.pt-ponto, .pt-fatia, .pt-seg, .pt-alvo { cursor:help; outline:none; }
.pt-seg:hover, .pt-seg:focus { filter:brightness(1.25); } .pt-fatia:hover, .pt-fatia:focus { stroke-width:30; }
.pt-alvo:hover, .pt-alvo:focus { background:var(--paper); border-radius:6px; }
.pt-ponto:hover, .pt-ponto:focus { fill:rgba(22,40,77,.12); }
.pt-cont { background:var(--red); color:#fff; font-size:10.5px; font-weight:700; min-width:18px; height:18px; border-radius:9px; display:inline-grid; place-items:center; padding:0 5px; }
/* importação */
.pt-diff td { font-size:12.5px; } .pt-antes { color:var(--red); text-decoration:line-through; } .pt-depois { color:var(--green); font-weight:600; }
/* parecer */
.pt-gaveta { position:fixed; top:34px; right:0; bottom:0; width:430px; background:#fff; border-left:1px solid var(--line-2); box-shadow:-12px 0 30px rgba(22,40,77,.14); transform:translateX(105%); transition:transform .25s; z-index:85; display:flex; flex-direction:column; }
.pt-gaveta.aberta { transform:none; }
.pt-gaveta .cab { background:var(--navy); color:#fff; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; }
.pt-gaveta .cab h2 { color:#fff; font:700 18px var(--serif); margin:0; }
.pt-gaveta .corpo { overflow-y:auto; padding:14px 18px; flex:1; }
.pt-mel { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
.pt-mel h3 { margin:0 0 4px; font-size:14px; color:var(--navy); }
.pt-opcoes { display:flex; gap:6px; margin:8px 0; }
.pt-opcoes button { flex:1; border:1px solid var(--line-2); background:#fff; border-radius:7px; padding:6px; font-weight:600; font-size:12.5px; cursor:pointer; }
.pt-opcoes button.sel.aprovar { background:var(--green); color:#fff; border-color:var(--green); }
.pt-opcoes button.sel.ajustar { background:var(--gold); color:var(--navy); border-color:var(--gold); }
.pt-opcoes button.sel.recusar { background:var(--red); color:#fff; border-color:var(--red); }
.pt-mel textarea { width:100%; min-height:54px; border:1px solid var(--line-2); border-radius:7px; padding:7px 9px; font-size:13px; resize:vertical; }
.pt-gaveta .pe { border-top:1px solid var(--line); padding:12px 18px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
@media (max-width: 900px) {
  .pt-graficos, .pt-kpis { grid-template-columns:1fr; } .pt-msg { grid-template-columns:1fr; height:auto; }
  .pt-gaveta { width:100%; } .pt-hbar { grid-template-columns:minmax(0,120px) minmax(0,1fr) 56px; } .pt-colunas2 { columns:1; }
  .pt-hbar span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
}
</style>

<body class="pt">
<div class="pt-faixa">
  <span>PROTÓTIPO DE MELHORIAS · telas atuais do sistema + acréscimos marcados como NOVO · não conectado · nada é gravado · dados reais de 25/09/2026, exceto onde indicado “DADOS FICTÍCIOS DE DEMONSTRAÇÃO”</span>
  <button id="abrirParecer">Parecer das melhorias (0/8)</button>
</div>
<div class="app" id="app">
  <div id="sidebarBox"></div>
  <main class="main" id="vista"></main>
</div>
<aside class="pt-gaveta" id="gaveta" aria-label="Parecer das melhorias">
  <div class="cab"><h2>Parecer das melhorias</h2><button class="btn" id="fecharParecer">Fechar</button></div>
  <div class="corpo" id="parecerCorpo"></div>
  <div class="pe"><button class="btn primario" id="baixarParecer">Baixar parecer</button><button class="btn" id="copiarParecer">Copiar parecer</button><span class="small muted" id="parecerMsg"></span></div>
</aside>

<script>
const TELAS = __TELAS__;
const SNAP = __SNAP__;
const IMPORT = __IMPORT__;
const HOJE = new Date(2026, 8, 25);
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n2 = (n) => String(n).padStart(2, '0');
const mi = (v) => v == null ? '—' : 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' mi';
const C = Object.fromEntries(SNAP.contratacoes.map((c) => [c.n, c]));
const demoFaixa = '<div class="pt-demo-faixa">DADOS FICTÍCIOS DE DEMONSTRAÇÃO</div>';
const NOVO = '<span class="pt-novo-sel">NOVO</span>';
function toast(t) { const d = document.createElement('div'); d.className = 'pt-toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
function topbar() { const t = document.createElement('div'); t.innerHTML = TELAS.telas.painel; return t.querySelector('.topbar').outerHTML; }
const TOPBAR = topbar();

// ================================================================ navegação + botão voltar (melhoria 2)
const ROTULO = { painel: 'Painel', contratacoes: 'Contratações', pendencias: 'Minhas pendências', atas: 'Atas de registro', relatorios: 'Relatórios', equipe: 'Equipe do GT', auditoria: 'Auditoria', manutencao: 'Manutenção', mensagens: 'Mensagens', agenda: 'Agenda de prazos', evolucao: 'Evolução', nova: 'Nova contratação' };
const SECUNDARIAS = ['detalhe', 'nova'];
let pilha = [{ v: 'painel' }];
function ir(v, p = {}, empilhar = true) { if (empilhar) pilha.push({ v, p }); else pilha = [{ v, p }]; render(); window.scrollTo(0, 0); }
function voltar() { if (pilha.length > 1) pilha.pop(); render(); window.scrollTo(0, 0); }
function botaoVoltar() {
  if (pilha.length < 2) return '';
  const a = pilha[pilha.length - 2];
  return `<button class="pt-voltar" onclick="voltar()">← Voltar para ${esc(a.v === 'detalhe' ? 'contratação ' + n2(a.p.n) : (ROTULO[a.v] || 'tela anterior'))}</button> ${NOVO}`;
}
function rota(href) {
  const [cam] = href.split('?');
  if (cam === '/' || cam === '') return ['painel', {}];
  if (cam === '/contratacoes/nova') return ['nova', {}];
  const m = cam.match(/^\/contratacoes\/([0-9a-f-]{36})/); if (m) return ['detalhe', { n: TELAS.uuid[m[1]] }];
  const v = cam.replace(/^\//, '').split('/')[0];
  return [ROTULO[v] ? v : 'painel', {}];
}

// ================================================================ menu lateral: o original + itens novos
const ICON = {
  msg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>',
  agenda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>',
  evol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>',
};
function renderSidebar(atual) {
  const box = $('#sidebarBox'); box.innerHTML = TELAS.sidebar;
  const nav = box.querySelector('.nav');
  const novo = (href, ic, txt, extra = '') => { const a = document.createElement('a'); a.href = href; a.innerHTML = `${ic} ${txt}${extra}<span class="pt-novo">NOVO</span>`; return a; };
  const pend = nav.querySelector('a[href="/pendencias"]');
  pend.after(novo('/agenda', ICON.agenda, 'Agenda de prazos'));
  pend.after(novo('/mensagens', ICON.msg, 'Mensagens', naoLidas() ? `<span class="pt-badge">${naoLidas()}</span>` : ''));
  nav.querySelector('a[href="/relatorios"]').after(novo('/evolucao', ICON.evol, 'Evolução'));
  nav.querySelectorAll('a').forEach((a) => { const [v] = rota(a.getAttribute('href')); a.classList.toggle('active', v === atual); a.removeAttribute('aria-current'); });
}

// ================================================================ telas reais (instantâneo) + acréscimos
function telaReal(html) { return html; }
function pos(v) {
  const main = $('#vista');
  if (v === 'painel') {
    const cab = main.querySelector('.cabecalho');
    const t = document.createElement('div'); t.innerHTML = ticker(); cab.after(t.firstElementChild);
  }
  if (SECUNDARIAS.includes(v) && pilha.length > 1) {
    const d = document.createElement('div'); d.innerHTML = botaoVoltar(); main.querySelector('.topbar').after(...d.childNodes);
  }
  if (v === 'manutencao') manutencaoAbas();
  if (v === 'mensagens') ligarAutocomplete();
}
// letreiro (melhoria 6) — eventos reais do sistema
function ticker() {
  const cs = SNAP.contratacoes;
  const valor = cs.reduce((a, c) => a + (c.valor || 0), 0);
  const ev = [
    ...cs.filter((c) => ['Devolvida', 'Divergência'].includes(c.situacao)).map((c) => ({ r: c.situacao.toUpperCase(), t: `${n2(c.n)} · ${c.titulo}`, n: c.n })),
    ...cs.filter((c) => c.atual_resp).map((c) => ({ r: 'EM ANDAMENTO', t: `${n2(c.n)} · ${c.titulo} — ${c.atual} com ${c.atual_resp.split(' ')[0]}`, n: c.n })),
    { r: 'CARTEIRA', t: `${cs.length} demandas · ${mi(valor)} em valor informado` },
    { r: 'ATENÇÃO', t: `${cs.filter((c) => !c.justificativa).length} demandas sem justificativa da área técnica` },
    { r: 'CARGA', t: `${SNAP.andamentos.length} demandas registradas na carga inicial de 24/09/2026` },
  ];
  return `<div class="pt-ticker" aria-label="Letreiro de notícias do sistema"><div class="rot">AO VIVO · GT</div><div class="janela"><div class="fita">${ev.map((e) => `<a ${e.n ? `data-pt-n="${e.n}"` : ''}><b>${esc(e.r)}</b>${esc(e.t)}</a>`).join('')}</div></div></div>`;
}

// ================================================================ melhoria 1 · mensagens (fictício)
let CONVERSAS = [
  { id: 1, titulo: 'Coordenação · Frente III', n: 1, part: 'Integrante A (Coordenação) · Integrante B (Ponto focal)', naoLidas: 1, msgs: [
    { de: 'Integrante A (Coordenação)', t: 'Bom dia. Qual a previsão para a manifestação do TI na contratação 01?', h: '09:12' },
    { eu: true, t: 'Bom dia. A manifestação está em elaboração; previsão até o fim da semana.', h: '09:20' },
    { de: 'Integrante A (Coordenação)', t: 'Obrigado. Registre, por favor, o andamento na contratação.', h: '09:22' }] },
  { id: 2, titulo: 'Elaboração · DOD da contratação 08', n: 8, part: 'Integrante C (Elaboração) · Integrante D (Conformidade)', naoLidas: 2, msgs: [
    { de: 'Integrante C (Elaboração)', t: 'Minuta do DOD enviada para conferência.', h: 'ontem' },
    { de: 'Integrante D (Conformidade)', t: 'Recebido. Retorno com observações até amanhã.', h: 'ontem' }] },
  { id: 3, titulo: 'GT PROPAG · avisos gerais', n: null, part: 'Todos os integrantes', naoLidas: 0, msgs: [
    { de: 'Integrante A (Coordenação)', t: 'Reunião de acompanhamento na sexta-feira, às 10h.', h: 'seg.' }] },
];
let conversaAtiva = 1;
const naoLidas = () => CONVERSAS.reduce((a, c) => a + c.naoLidas, 0);
function vMensagens() {
  const c = CONVERSAS.find((x) => x.id === conversaAtiva); c.naoLidas = 0;
  return `${TOPBAR}<div class="cabecalho"><div><div class="eyebrow">Comunicação entre integrantes ${NOVO}</div><h1>Mensagens</h1><p class="muted">Conversas individuais ou em grupo, opcionalmente vinculadas a uma contratação. Só os participantes leem.</p></div><div class="acoes"><button class="btn primario" onclick="compondo=true;destinos=[];render()">+ Nova mensagem</button></div></div>

  const d = document.createElement('div'); d.className = 'pt-tip'; d.hidden = true; document.body.appendChild(d);
  const mostrar = (el, x, y) => { const l = el.dataset.tip.split('\n'); d.innerHTML = `<b>${esc(l[0])}</b>` + (l.length > 1 ? '\n' + l.slice(1).map(esc).join('\n') : ''); d.hidden = false; const r = d.getBoundingClientRect(); d.style.left = Math.min(x + 14, innerWidth - r.width - 8) + 'px'; d.style.top = (y + 16 + r.height > innerHeight ? y - r.height - 10 : y + 16) + 'px'; };
  document.addEventListener('mousemove', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) mostrar(el, e.clientX, e.clientY); else d.hidden = true; });
  document.addEventListener('focusin', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); mostrar(el, r.left + r.width / 2, r.bottom); } });
  document.addEventListener('focusout', () => (d.hidden = true));
  document.addEventListener('scroll', () => (d.hidden = true), true);
})();
render();
</script>
</body>
</html>
