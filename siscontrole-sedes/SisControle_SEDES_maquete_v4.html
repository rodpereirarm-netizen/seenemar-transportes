<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SisControle SEDES v4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Maquete navegável do Sistema de Controle Interno e Auditoria da SEDES/RJ, com dados fictícios (versão 4).">
<meta name="theme-color" content="#062a57">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Public+Sans:wght@600;700&display=swap">
<style>
/* =========================================================================
   SisControle SEDES — Maquete navegável (dados fictícios)
   Layout: barra lateral institucional fixa + área de trabalho com cabeçalho
   e conteúdo em grade. Tokens abaixo concentram cor e tipografia
   (identidade Governo do Estado do RJ: azul institucional sobre neutros frios).
   ========================================================================= */
/* Três temas: institucional (padrão, abaixo), claro e escuro, escolhidos pelo usuário em
   :root[data-tema]. Visual de "workspace" no azul institucional do Governo do RJ: trilho de ícones,
   abas de visão, barra de contexto e grade de widgets. Dourado do brasão como destaque.
   Tema único escuro, por escolha. */
:root {
  --font-display: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-text: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --bg: #0b1b33;          /* fundo da área de trabalho */
  --surface: #10243f;     /* widget */
  --surface-2: #152d4d;   /* painel interno, cabeçalho de tabela */
  --surface-3: #1c3859;
  --line: #21406a;
  --line-strong: #2e5283;
  --fg: #e8eef7;
  --fg-2: #b2c3db;
  --fg-3: #8399b8;

  --gov: #062a57;         /* trilho e barra superior */
  --gov-2: #0d3a72;
  --gov-fg: #eaf1fb;
  --gov-fg-2: #9db6d8;
  --brand: #2f7be5;
  --brand-hover: #4a8ff0;
  --brand-soft: #173a66;
  --brand-ink: #ffffff;
  --gold: #d4ae3a;

  --ok: #4cc777;      --ok-soft: #173223;
  --warn: #f0b429;    --warn-soft: #3a2f12;   --warn-mark: #e0a526;
  --crit: #f26b61;    --crit-soft: #3d1c1a;   --crit-mark: #d9443a;
  --serious: #f08a3c; --serious-soft: #3a2614;
  --info: #6aa6ff;    --info-soft: #173a66;
  --violet: #c39af2;  --violet-soft: #2e2140;
  --muted-soft: #1f3a5c;
  --ok-mark: #2e9e4f;

  /* Séries (ordem fixa, validadas contra o fundo do widget) */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;

  --radius: 6px;
  --radius-sm: 4px;
  --shadow: none;
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, .55);
  --sidebar-w: 56px;
  color-scheme: dark;
}


/* ---------- Tema claro ---------- */
:root[data-tema="claro"] {
  --bg: #f2f5f9; --surface: #ffffff; --surface-2: #f6f8fb; --surface-3: #e9eef5;
  --line: #dbe2ec; --line-strong: #c4cfdd; --fg: #132033; --fg-2: #45556b; --fg-3: #66768c;
  --gov: #ffffff; --gov-2: #eaf0f8; --gov-fg: #0f2a4d; --gov-fg-2: #5b6d86;
  --brand: #1858a8; --brand-hover: #134a8f; --brand-soft: #e6eef9; --brand-ink: #ffffff; --gold: #9a7612;
  --ok: #1d7f46; --ok-soft: #e3f3ea; --warn: #8a5a00; --warn-soft: #fbf0d9; --warn-mark: #e3a008;
  --crit: #b4302a; --crit-soft: #fbe7e5; --crit-mark: #d6453d; --serious: #b45309; --serious-soft: #fdeedd;
  --info: #1858a8; --info-soft: #e6eef9; --violet: #5843b8; --violet-soft: #eeebfa; --muted-soft: #eef1f5; --ok-mark: #2f9e5f;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --shadow: 0 1px 2px rgba(15, 35, 70, .06), 0 2px 8px rgba(15, 35, 70, .05); --shadow-lg: 0 12px 40px rgba(10, 30, 60, .18);
  color-scheme: light;
}
/* ---------- Tema escuro ---------- */
:root[data-tema="escuro"] {
  --bg: #15181e; --surface: #1e222a; --surface-2: #252a33; --surface-3: #2c323c;
  --line: #2e343e; --line-strong: #3d4450; --fg: #e7eaee; --fg-2: #b4bbc6; --fg-3: #858d9a;
  --gov: #101318; --gov-2: #1a1e25; --gov-fg: #dfe3e8; --gov-fg-2: #7f8794;
  --brand: #3b82f6; --brand-hover: #5a96f7; --brand-soft: #1d2a40; --gold: #c9a227;
  --info-soft: #1d2a40; --muted-soft: #2a2f38;
  color-scheme: dark;
}
:root[data-tema="claro"] .card { box-shadow: var(--shadow); }
:root[data-tema="claro"] .mock-banner { border-bottom-color: #f0dfb5; }

* { box-sizing: border-box; }
.ico { width: 16px; height: 16px; flex: none; }
.kpi .foot .ico { width: 14px; height: 14px; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-text); font-size: 13px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--gov); }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; color: var(--fg); }
h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.05rem; font-weight: 650; }
h3 { font-size: .95rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-size: .86em; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-3); }
.sec { color: var(--fg-2); }
.small { font-size: .82rem; }
.eyebrow { font-size: .75rem; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100%; }
.sidebar {
  background: var(--gov); color: var(--gov-fg); border-right: 1px solid var(--line);
  position: sticky; top: 0; height: 100vh; z-index: 50;
  display: flex; flex-direction: column; align-items: stretch;
  padding-left: env(safe-area-inset-left, 0px);
}
.brand { display: grid; place-items: center; height: 52px; border-bottom: 1px solid var(--line); }
.brand .brasao { width: 26px; height: 30px; }
.brand-txt { display: none; }
.nav { padding: 8px 0; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; overflow-x: visible; }
.nav-group { height: 1px; background: var(--line); margin: 6px 12px; font-size: 0; }
.nav a {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
  height: 38px; margin: 0 8px; border-radius: 6px; color: var(--gov-fg-2); text-decoration: none;
}
.nav a:hover { background: var(--gov-2); color: var(--gov-fg); text-decoration: none; }
.nav a.active { color: var(--gov-fg); background: var(--gov-2); box-shadow: inset 2px 0 0 var(--gold); }
.nav a .ico { width: 19px; height: 19px; }
.nav a .lbl { display: none; }
.nav a .count { position: absolute; top: 1px; right: 0; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 8px; background: var(--surface-3); color: var(--fg); font-size: .75rem; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.nav a .count.alert { background: var(--crit-mark); color: #fff; }
.nav a .tag { display: none; }
.nav a.disabled { opacity: .45; }
.nav a[data-label]:hover::after, .nav a[data-label]:focus-visible::after {
  content: attr(data-label); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
  background: var(--surface-3); color: var(--fg); padding: 5px 9px; border-radius: 5px; font-size: .78rem; white-space: nowrap;
  box-shadow: var(--shadow-lg); border: 1px solid var(--line-strong); pointer-events: none; z-index: 70;
}
.sidebar-foot { padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--gov-fg-2); }
.env-tag { writing-mode: vertical-rl; transform: rotate(180deg); font-size: .75rem; letter-spacing: .14em; font-weight: 600; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  background: var(--gov); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; height: 52px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.menu-btn { display: none; }
.search { flex: 1; max-width: 460px; margin: 0 auto; position: relative; }
.search input { width: 100%; height: 32px; border: 1px solid var(--line); background: var(--gov-2); border-radius: 7px; padding: 0 34px 0 34px; color: var(--fg); }
.search input::placeholder { color: var(--fg-3); }
.search .ico { position: absolute; left: 11px; top: 8px; width: 16px; height: 16px; color: var(--fg-3); }
.search .kbd { position: absolute; right: 8px; top: 7px; font-size: .75rem; padding: 0 6px; background: var(--surface-3); border-color: var(--line-strong); color: var(--fg-2); }
.topbar-right { display: flex; align-items: center; gap: 6px; }
.icon-btn { position: relative; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; border-radius: 7px; cursor: pointer; color: var(--fg-2); }
.icon-btn:hover { background: var(--gov-2); color: var(--fg); }
.icon-btn .ico { width: 17px; height: 17px; }
.icon-btn .dot { position: absolute; top: 1px; right: 0; min-width: 15px; height: 15px; border-radius: 8px; background: var(--crit-mark); color: #fff; font-size: .75rem; display: grid; place-items: center; padding: 0 4px; font-weight: 700; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: transparent; border: 2px solid var(--gold); color: var(--gold); display: grid; place-items: center; font-weight: 700; font-size: .75rem; flex: none; }

/* Abas de visão */
.tabbar {
  display: flex; align-items: stretch; gap: 0; background: var(--gov); border-bottom: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 38px;
}
.vtabs { display: flex; align-items: stretch; overflow-x: auto; min-width: 0; }
.vtab { display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--fg-3); text-decoration: none; font-weight: 600; font-size: .8rem; border-right: 1px solid var(--line); white-space: nowrap; }
.vtab:hover { color: var(--fg); text-decoration: none; background: var(--gov-2); }
.vtab.on { background: var(--bg); color: var(--fg); box-shadow: inset 0 2px 0 var(--gold); }
.vtab.add { padding: 0 12px; }
.tab-right { margin-left: auto; display: flex; align-items: center; gap: 10px; padding-left: 12px; white-space: nowrap; }
.tab-right .upd { color: var(--fg-3); font-size: .76rem; }
.tab-right .upd b { color: var(--fg-2); font-weight: 600; }
.view-sel { height: 28px; border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 6px; padding: 0 8px; color: var(--fg); font-size: .78rem; max-width: 250px; }
.refdate { display: flex; flex-direction: column; line-height: 1.1; font-size: .76rem; padding: 2px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-2); }
.refdate small { font-size: .75rem; color: var(--fg-3); }

/* Barra de contexto */
.ctxbar {
  display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ctx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ctx span { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); padding-left: 2px; }
.ctx select { height: 30px; min-width: 150px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 0 8px; color: var(--fg); font-size: .8rem; }
.ctxbar .grow { flex: 1; }

.mock-banner {
  background: var(--warn-soft); color: var(--warn); font-size: .75rem;
  padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.content {
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px; width: 100%;
}
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 1.25rem; }
.page-head .sub { color: var(--fg-2); margin-top: 4px; max-width: 80ch; }
.crumbs { font-size: .76rem; color: var(--fg-3); margin-bottom: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--fg-3); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Componentes ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 40px; }
.card-head h2 { font-size: .75rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--fg); display: flex; align-items: center; gap: 8px; }
.card-head h2::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok-mark); flex: none; }
.card-head .hint { font-size: .78rem; color: var(--fg-3); }
.card-body { padding: 12px 14px; }
.card-body.flush { padding: 0; }

.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }

.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg);
  font-weight: 550; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-3); text-decoration: none; }
.btn .ico { width: 16px; height: 16px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: var(--brand-hover); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }
.btn.danger:hover { background: var(--crit-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { height: 30px; padding: 0 10px; font-size: .82rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: .76rem; font-weight: 600; white-space: nowrap; line-height: 1.6; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.c-neutral { background: var(--muted-soft); color: var(--fg-2); }
.c-info { background: var(--info-soft); color: var(--info); }
.c-warn { background: var(--warn-soft); color: var(--warn); }
.c-crit { background: var(--crit-soft); color: var(--crit); }
.c-ok { background: var(--ok-soft); color: var(--ok); }
.c-violet { background: var(--violet-soft); color: var(--violet); }
.c-serious { background: var(--serious-soft); color: var(--serious); }
.tag-org { font-family: var(--font-mono); font-size: .75rem; font-weight: 600; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--fg-2); background: var(--surface-2); white-space: nowrap; }
.lock { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; color: var(--violet); font-weight: 600; }
.lock .ico { width: 13px; height: 13px; }

.prazo { display: inline-flex; flex-direction: column; line-height: 1.25; }
.prazo b { font-weight: 600; font-variant-numeric: tabular-nums; }
.prazo span { font-size: .75rem; font-weight: 600; }
.prazo.vencido span { color: var(--crit); }
.prazo.avencer span { color: var(--warn); }
.prazo.noprazo span { color: var(--ok); }
.prazo.encerrado span { color: var(--fg-3); }

.sev { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--fg-2); }
.sev i { display: inline-flex; gap: 2px; }
.sev i b { width: 4px; height: 11px; border-radius: 1px; background: var(--line-strong); }
.sev.g1 i b:nth-child(-n+1), .sev.g2 i b:nth-child(-n+2), .sev.g3 i b:nth-child(-n+3), .sev.g4 i b:nth-child(-n+4) { background: var(--fg-2); }
.sev.g4 i b:nth-child(-n+4) { background: var(--crit-mark); }
.sev.g3 i b:nth-child(-n+3) { background: var(--serious); }

/* Tabelas */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .875rem; }
.t th { text-align: left; font-size: .75rem; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-3); padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr.link { cursor: pointer; }
.t tbody tr.link:hover td { background: var(--surface-2); }
.t .title-cell { min-width: 240px; }
.t .title-cell b { display: block; font-weight: 600; color: var(--fg); }
.t .title-cell small { color: var(--fg-3); font-size: .78rem; }
.t td.r, .t th.r { text-align: right; }
.t tr.row-crit td:first-child { box-shadow: inset 3px 0 0 var(--crit-mark); }
.t tr.row-warn td:first-child { box-shadow: inset 3px 0 0 var(--warn-mark); }

/* Filtros */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span, .field > label { font-size: .75rem; font-weight: 600; color: var(--fg-2); }
.field input, .field select, .field textarea {
  height: 36px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 0 10px; min-width: 0;
}
.field textarea { height: auto; min-height: 92px; padding: 8px 10px; resize: vertical; line-height: 1.45; }
.field .help { font-size: .75rem; color: var(--fg-3); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 0 12px; height: 34px; cursor: pointer; font-size: .82rem; font-weight: 600; color: var(--fg-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.seg.answers button[aria-pressed="true"][data-v="conforme"] { background: var(--ok); color: #fff; }
.seg.answers button[aria-pressed="true"][data-v="nao_conforme"] { background: var(--crit); color: #fff; }
.seg.answers button[aria-pressed="true"][data-v="com_ressalva"] { background: var(--warn-mark); color: #1b1300; }
.seg.answers button[aria-pressed="true"][data-v="nao_se_aplica"] { background: var(--fg-3); color: #fff; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--fg-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
.tabs button .n { font-size: .75rem; background: var(--surface-3); color: var(--fg-2); padding: 0 6px; border-radius: 99px; margin-left: 6px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.kpi .label { font-size: .76rem; color: var(--fg-2); font-weight: 600; }
.kpi .value { font-family: var(--font-display); font-size: 1.85rem; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .value small { font-size: .9rem; font-weight: 600; color: var(--fg-3); margin-left: 2px; }
.kpi .foot { font-size: .75rem; color: var(--fg-3); display: flex; gap: 6px; align-items: center; }
.kpi.crit .value { color: var(--crit); }
.kpi.warn .value { color: var(--warn); }
.delta-up { color: var(--crit); font-weight: 600; }
.delta-down { color: var(--ok); font-weight: 600; }

/* Ações do dia */
.todo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.todo a { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; text-decoration: none; color: inherit; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.todo a:hover { border-color: var(--brand); }
.todo .n { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.todo .t { font-size: .82rem; color: var(--fg-2); font-weight: 600; }
.todo .s { font-size: .75rem; color: var(--fg-3); }
.todo a.crit .n { color: var(--crit); }
.todo a.warn .n { color: var(--warn); }

/* Gráficos */
.chart { width: 100%; display: block; }
.chart text { fill: var(--fg-2); font-family: var(--font-text); font-size: 12px; }
.chart .axis-label { fill: var(--fg-3); }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .bar-g rect, .chart g.bar-row:hover rect.m { opacity: .85; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .78rem; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.line { height: 3px; width: 14px; border-radius: 2px; }
.tooltip {
  position: fixed; z-index: 100; pointer-events: none; background: var(--fg); color: var(--surface);
  font-size: .78rem; padding: 7px 10px; border-radius: 7px; box-shadow: var(--shadow-lg); max-width: 260px; line-height: 1.4;
}
.tooltip b { font-weight: 700; }

/* Stepper do fluxo */
.flow { display: flex; gap: 0; overflow-x: auto; padding: 4px 0; }
.flow .st { flex: 1 0 104px; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; text-align: center; font-size: .75rem; color: var(--fg-3); padding: 0 4px; }
.flow .st::before { content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.flow .st:first-child::before { display: none; }
.flow .st .b { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; position: relative; z-index: 1; font-size: .75rem; font-weight: 700; }
.flow .st.done { color: var(--fg-2); }
.flow .st.done .b { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.flow .st.done::before, .flow .st.cur::before { background: var(--brand); }
.flow .st.cur { color: var(--fg); font-weight: 650; }
.flow .st.cur .b { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); color: var(--brand); }

/* Linha do tempo */
.timeline { display: flex; flex-direction: column; }
.ev { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 18px; }
.ev::before { content: ""; position: absolute; left: 15px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.ev:last-child::before { display: none; }
.ev .dotc { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--fg-2); }
.ev .dotc .ico { width: 15px; height: 15px; }
.ev .dotc.c-ok { background: var(--ok-soft); color: var(--ok); }
.ev .dotc.c-warn { background: var(--warn-soft); color: var(--warn); }
.ev .dotc.c-info { background: var(--info-soft); color: var(--info); }
.ev .dotc.c-violet { background: var(--violet-soft); color: var(--violet); }
.ev .dotc.c-crit { background: var(--crit-soft); color: var(--crit); }
.ev .head { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.ev .head b { font-weight: 650; }
.ev .head .when { font-size: .76rem; color: var(--fg-3); }
.ev .txt { margin-top: 4px; color: var(--fg-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: .86rem; }

/* Detalhe */
.dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; }
.dl div { min-width: 0; }
.dl dt { font-size: .75rem; font-weight: 650; color: var(--fg-3); text-transform: uppercase; letter-spacing: .05em; }
.dl dd { margin: 3px 0 0; overflow-wrap: anywhere; }
.note { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--fg-2); }
.files { display: flex; flex-direction: column; gap: 8px; }
.file { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.file .ext { width: 34px; height: 40px; border-radius: 5px; background: var(--brand-soft); color: var(--brand); font-size: .75rem; font-weight: 800; display: grid; place-items: center; font-family: var(--font-mono); }
.file b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file small { color: var(--fg-3); font-size: .75rem; }
.dropzone { border: 1.5px dashed var(--line-strong); border-radius: 8px; padding: 14px; text-align: center; color: var(--fg-3); font-size: .82rem; }
.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: 8px; font-size: .85rem; align-items: flex-start; }
.callout .ico { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.callout.info { background: var(--info-soft); color: var(--info); }
.callout.warn { background: var(--warn-soft); color: var(--warn); }
.callout.crit { background: var(--crit-soft); color: var(--crit); }
.callout.ok { background: var(--ok-soft); color: var(--ok); }
.callout p { color: inherit; }

.progress { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; display: flex; gap: 2px; }
.progress i { display: block; height: 100%; }
.mini-progress { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.mini-progress .progress { flex: 1; }

/* Checklist */
.ck-sec { padding: 12px 18px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-weight: 650; font-family: var(--font-display); font-size: .9rem; display: flex; justify-content: space-between; gap: 10px; }
.ck-item { padding: 14px 18px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; }
.ck-item .q-n { font-family: var(--font-mono); font-size: .8rem; color: var(--fg-3); padding-top: 2px; }
.ck-item .q { font-weight: 550; }
.ck-item .law { font-size: .76rem; color: var(--fg-3); margin-top: 2px; }
.ck-item .ans { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
.ck-item .just { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; margin-top: 10px; }
.ck-item .gen { margin-top: 8px; font-size: .78rem; }
.models { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.model { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.model .ver { font-family: var(--font-mono); font-size: .76rem; color: var(--fg-3); }

/* Árvore de áreas */
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { padding-left: 22px; border-left: 1px dashed var(--line-strong); margin-left: 9px; }
.tree li { padding: 3px 0; }
.tree .node { display: inline-flex; gap: 8px; align-items: center; padding: 3px 8px; border-radius: 6px; }
.tree .node:hover { background: var(--surface-3); }
.tree .sig { font-family: var(--font-mono); font-weight: 600; font-size: .8rem; color: var(--brand); min-width: 70px; }
.tree .tp { font-size: .75rem; color: var(--fg-3); border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; }

/* Heatmap de riscos */
.heat { display: grid; grid-template-columns: 28px repeat(5, minmax(0, 1fr)); gap: 3px; max-width: 460px; }
.heat .cell { aspect-ratio: 1.4; border-radius: 4px; display: grid; place-items: center; font-weight: 700; font-size: .85rem; color: #1b1b1b; max-width: 100%; }
.heat .ax { display: grid; place-items: center; font-size: .75rem; color: var(--fg-3); }

/* Modal, drawer, toast */
.overlay { position: fixed; inset: 0; background: rgba(8, 20, 40, .45); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; border: 1px solid var(--line); }
.modal.wide { width: min(760px, 100%); }
.modal-head { padding: 18px 20px 12px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.modal-head p { color: var(--fg-2); margin-top: 4px; font-size: .86rem; }
.modal-body { padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; background: var(--surface-2); border-radius: 0 0 12px 12px; flex-wrap: wrap; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 120; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--fg); color: var(--surface); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow-lg); font-size: .86rem; max-width: 360px; display: flex; gap: 8px; align-items: center; animation: tin .2s ease-out; }
.toast .ico { width: 16px; height: 16px; flex: none; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

.sign-box { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; background: var(--surface-2); }
.sign-box canvas { width: 96px; height: 96px; background: #fff; border-radius: 6px; border: 1px solid var(--line); image-rendering: pixelated; }
.code-big { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; letter-spacing: .04em; color: var(--fg); }

/* Login / verificação pública */
.public { min-height: 100%; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(160deg, var(--gov) 0%, var(--gov-2) 55%, var(--bg) 55.2%); }
.public-card { width: min(420px, 100%); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 28px; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--line); }
.public-card.wide { width: min(560px, 100%); }
.public-brand { display: flex; gap: 12px; align-items: center; }
.public-brand .brasao { width: 44px; height: 50px; }
.verify-ok { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 10px; background: var(--ok-soft); color: var(--ok); }
.verify-ok .ico { width: 28px; height: 28px; flex: none; }

.empty { padding: 28px; text-align: center; color: var(--fg-3); }
.phase2 { display: flex; flex-direction: column; gap: 6px; }
.kbd { font-family: var(--font-mono); font-size: .76rem; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface-2); }
.json { font-family: var(--font-mono); font-size: .76rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-2); margin: 0; }
.diff-del { color: var(--crit); }
.diff-add { color: var(--ok); }
.agenda { display: flex; flex-direction: column; }
.agenda .d { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); align-items: center; text-decoration: none; color: inherit; }
.agenda .d:last-child { border-bottom: 0; }
.agenda .d:hover { background: var(--surface-2); text-decoration: none; }
.agenda .day { text-align: center; border-radius: 8px; padding: 4px 0; background: var(--surface-3); line-height: 1.1; }
.agenda .day b { display: block; font-family: var(--font-display); font-size: 1.15rem; }
.agenda .day small { font-size: .75rem; text-transform: uppercase; color: var(--fg-3); letter-spacing: .06em; }
.agenda .day.crit { background: var(--crit-soft); color: var(--crit); }
.agenda .day.warn { background: var(--warn-soft); color: var(--warn); }
.notif { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.notif.unread { background: color-mix(in srgb, var(--brand-soft) 55%, var(--surface)); }
.notif:last-child { border-bottom: 0; }

/* ---------- Widgets do painel ---------- */
.wgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.w2 { grid-column: span 2; }
.w4 { grid-column: 1 / -1; }
.widget { display: flex; flex-direction: column; }
.widget .card-head { padding: 7px 10px 7px 14px; }
.wicons { display: flex; gap: 2px; margin-left: auto; }
.wicons button, .wicons a { width: 26px; height: 26px; display: grid; place-items: center; border: 0; background: transparent; color: var(--fg-3); border-radius: 5px; cursor: pointer; }
.wicons button:hover, .wicons a:hover { background: var(--surface-3); color: var(--fg); }
.wicons .ico { width: 15px; height: 15px; }
.wbody { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
.wchips { display: flex; gap: 6px; flex-wrap: wrap; }
.wchip { font-size: .75rem; padding: 3px 10px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.inner { background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.inner .eyebrow { color: var(--fg-2); }

.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 14px 10px 12px; text-align: center; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; }
a.tile:hover { border-color: var(--line-strong); background: var(--surface-3); text-decoration: none; }
.tile .big { font-size: 1.75rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile .big small { font-size: .85rem; color: var(--fg-3); font-weight: 500; margin-left: 2px; }
.tile .cap { font-size: .76rem; color: var(--fg-3); }
.tile.crit .big { color: var(--crit); }
.tile.warn .big { color: var(--warn); }

.xbars { display: flex; flex-direction: column; gap: 5px; }
.xbar { display: grid; grid-template-columns: minmax(0, 92px) minmax(0, 1fr); gap: 8px; align-items: center; font-size: .78rem; }
.xbar .nm { text-align: right; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: .75rem; }
.xbar .tr { display: flex; align-items: center; gap: 6px; min-width: 0; }
.xbar .b { height: 15px; background: var(--s1); border-radius: 0 3px 3px 0; min-width: 3px; }
.xbar .v { font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600; white-space: nowrap; }
.xbar.hot .b { background: var(--crit-mark); display: flex; justify-content: flex-end; align-items: center; padding-right: 6px; color: #fff; font-weight: 700; font-size: .75rem; }

.donut-wrap { display: grid; place-items: center; }
.donut-wrap svg { width: 100%; max-width: 300px; height: auto; }
.donut-wrap text { fill: var(--fg-2); font-size: 12px; font-family: var(--font-text); }

.sbar { display: flex; height: 18px; border-radius: 3px; overflow: hidden; gap: 2px; background: var(--surface-3); }
.sbar i { display: grid; place-items: center; font-style: normal; font-size: .75rem; font-weight: 700; color: #fff; min-width: 18px; }
.legend-dots { display: flex; gap: 12px; flex-wrap: wrap; font-size: .75rem; color: var(--fg-2); }
.legend-dots span { display: inline-flex; align-items: center; gap: 5px; }
.legend-dots i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.xmark { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: var(--crit-mark); color: #fff; font-size: .75rem; font-weight: 800; margin-right: 6px; }
.okmark { background: var(--ok-mark); }

.treemap { position: relative; height: 230px; border-radius: 4px; overflow: hidden; }
.treemap .tm { position: absolute; overflow: hidden; display: grid; place-items: center; text-align: center; color: #fff; font-weight: 700; font-size: .78rem; border: 1px solid var(--surface); text-decoration: none; line-height: 1.2; }
.treemap .tm small { display: block; font-weight: 500; font-size: .75rem; opacity: .85; }
.treemap .tm:hover { filter: brightness(1.15); text-decoration: none; }

.ladder-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
table.lad { width: 100%; border-collapse: collapse; font-size: .78rem; font-variant-numeric: tabular-nums; }
.lad th { background: var(--surface-2); color: var(--fg-2); font-weight: 600; text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lad th:first-child, .lad td:first-child { text-align: left; }
.lad th.today { background: var(--brand); color: #fff; }
.lad td { padding: 5px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; color: var(--fg); }
.lad td.today { background: color-mix(in srgb, var(--brand) 14%, transparent); }
.lad td.z { color: var(--fg-3); }
.lad td.late { color: var(--crit); font-weight: 700; }
.lad tr.l0 td { background: var(--surface-2); font-weight: 700; }
.lad tr.l0 td.today { background: color-mix(in srgb, var(--brand) 22%, var(--surface-2)); }
.lad tr.l1 td:first-child { padding-left: 24px; }
.lad tr.l2 td:first-child { padding-left: 46px; color: var(--fg-2); }
.lad .tg { border: 0; background: none; color: var(--fg-2); cursor: pointer; padding: 0 4px 0 0; font-size: .75rem; }
.lad a { color: inherit; }

.gbar text { fill: var(--fg-3); font-size: 12px; font-family: var(--font-text); }
.flowlist { display: flex; flex-direction: column; gap: 7px; }
.flowrow { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: .78rem; }
.flowrow .nm { color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flowrow .tr { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.flowrow .tr i { display: block; height: 100%; border-radius: 4px; }
.flowrow .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.todo a { background: var(--surface); }

/* ---------- Relatório, assinaturas e trilha (v2) ---------- */
.avs { display: flex; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; background: var(--surface-3); color: var(--fg); border: 2px solid var(--line-strong); flex: none; }
.avs .av + .av { margin-left: -7px; }
.av.ok { border-color: var(--ok-mark); }
.av.pend { border-style: dashed; border-color: var(--warn-mark); color: var(--warn); }
.av.sm { width: 26px; height: 26px; background: var(--brand-soft); color: var(--info); border-color: transparent; }
.siglist { display: flex; flex-direction: column; gap: 10px; }
.sigrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.sigrow .av { width: 32px; height: 32px; }
.resp-list { display: flex; flex-direction: column; gap: 6px; }
.resp-row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) 32px; gap: 6px; align-items: center; }
.resp-row select { height: 34px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); padding: 0 8px; min-width: 0; }

.paper-wrap { min-width: 0; }
.paper { background: #ffffff; color: #1d2a3a; border-radius: 4px; padding: 36px 40px 28px; box-shadow: var(--shadow-lg); font-size: 12.5px; line-height: 1.55; display: flex; flex-direction: column; gap: 10px; }
.paper h3 { color: #062a57; font-size: .85rem; margin-top: 8px; text-transform: uppercase; letter-spacing: .04em; }
.paper p, .paper li { color: #1d2a3a; }
.paper-head { display: flex; gap: 12px; align-items: center; font-size: .75rem; line-height: 1.45; color: #34475f; border-bottom: 2px solid #062a57; padding-bottom: 10px; }
.paper-head b { color: #062a57; letter-spacing: .03em; }
.paper-head .brasao { width: 38px; height: 44px; flex: none; }
.paper-title { color: #062a57; font-size: 1.05rem; text-align: center; margin-top: 8px; }
.paper-sub { text-align: center; color: #5a6b85; font-size: .78rem; }
.ptable { width: 100%; border-collapse: collapse; font-size: .78rem; }
.ptable th, .ptable td { border: 1px solid #ccd6e3; padding: 5px 8px; text-align: left; vertical-align: top; color: #1d2a3a; }
.ptable th { background: #eef3f9; width: 28%; font-weight: 600; color: #062a57; }
.ptable.center th, .ptable.center td { text-align: center; width: auto; }
.plist { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.plist i { color: #5a6b85; }
.psigs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.psig { border-top: 1px solid #1d2a3a; padding-top: 6px; display: flex; flex-direction: column; font-size: .75rem; color: #34475f; }
.psig b { color: #1d2a3a; font-size: .8rem; }
.psig .pp { font-weight: 700; color: #062a57; }
.psig .pst { color: #1d7f46; }
.psig.pend { border-top-style: dashed; }
.psig.pend .pst { color: #9a6400; font-weight: 600; }
.paper-foot { display: flex; gap: 12px; align-items: center; border-top: 1px solid #ccd6e3; padding-top: 10px; margin-top: 6px; font-size: .75rem; color: #5a6b85; }
.paper-foot b { color: #1d2a3a; font-family: var(--font-mono); }
.pqr { width: 64px; height: 64px; image-rendering: pixelated; flex: none; }

.trilha td { vertical-align: top; }
.tresumo { font-weight: 600; color: var(--fg); margin-bottom: 6px; }
.tvs { display: flex; flex-direction: column; gap: 4px; }
.tv { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .8rem; }
.tk { color: var(--fg-3); min-width: 110px; }
.told { color: var(--fg-3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--crit) 60%, transparent); }
.tarrow { color: var(--fg-3); }
.tnew { color: var(--fg); background: var(--surface-3); padding: 1px 8px; border-radius: 4px; font-weight: 600; }
.tv-nulo { font-style: italic; font-weight: 400; color: var(--fg-3); }
.chip .ico { width: 12px; height: 12px; }

/* ---------- Tema: seletor ---------- */
.theme-seg { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--gov-2); margin-right: 4px; }
.theme-seg .icon-btn { width: 28px; height: 28px; }
.theme-seg .icon-btn[aria-pressed="true"] { background: var(--brand); color: #fff; }
.theme-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.theme-card { display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface-2); cursor: pointer; color: var(--fg); }
.theme-card.on { border-color: var(--brand); }
.theme-card > span:last-child { display: flex; flex-direction: column; gap: 2px; }
.tprev { display: grid; grid-template-columns: 14px 1fr 1fr; grid-template-rows: 10px 1fr; gap: 4px; height: 70px; padding: 5px; border-radius: 5px; }
.tprev i { grid-row: 1 / -1; border-radius: 3px; }
.tprev b { grid-column: 2 / -1; border-radius: 2px; }
.tprev u { border-radius: 3px; }
.tp-institucional { background: #0b1b33; } .tp-institucional i { background: #062a57; box-shadow: inset 2px 0 0 #d4ae3a; } .tp-institucional b { background: #062a57; } .tp-institucional u { background: #10243f; border: 1px solid #21406a; }
.tp-claro { background: #f2f5f9; border: 1px solid #dbe2ec; } .tp-claro i { background: #fff; border: 1px solid #dbe2ec; } .tp-claro b { background: #fff; border: 1px solid #dbe2ec; } .tp-claro u { background: #fff; border: 1px solid #dbe2ec; }
.tp-escuro { background: #15181e; } .tp-escuro i { background: #101318; } .tp-escuro b { background: #101318; } .tp-escuro u { background: #1e222a; border: 1px solid #2e343e; }

/* ---------- Configurações e manutenção ---------- */
.cfg-layout { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 12px; align-items: start; }
.cfg-nav { display: flex; flex-direction: column; padding: 6px; position: sticky; top: 110px; }
.cfg-nav button { text-align: left; border: 0; background: none; color: var(--fg-2); padding: 9px 12px; border-radius: 6px; cursor: pointer; font-weight: 550; }
.cfg-nav button:hover { background: var(--surface-2); color: var(--fg); }
.cfg-nav button.on { background: var(--brand-soft); color: var(--info); box-shadow: inset 3px 0 0 var(--brand); }
.cfg-list { display: flex; flex-direction: column; }
.cfg-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.cfg-row:last-child { border-bottom: 0; }
.cfg-row > div:first-child { min-width: 0; flex: 1 1 260px; }
.cfg-ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cfg-ctrl input, .cfg-ctrl select, .t input { height: 32px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); padding: 0 8px; min-width: 0; }
.cfg-ctrl .brasao { width: 30px; height: 34px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .sl { width: 38px; height: 22px; border-radius: 11px; background: var(--line-strong); position: relative; transition: background .15s; flex: none; }
.switch .sl::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + .sl { background: var(--brand); }
.switch input:checked + .sl::after { transform: translateX(16px); }
.switch input:focus-visible + .sl { outline: 2px solid var(--brand); outline-offset: 2px; }
.switch.dis { cursor: not-allowed; opacity: .6; }
.svc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.svc-i { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.dotst { width: 10px; height: 10px; border-radius: 50%; background: var(--ok-mark); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok-mark) 25%, transparent); }
.dotst.aviso { background: var(--warn-mark); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn-mark) 25%, transparent); }
.stor { display: flex; flex-direction: column; gap: 6px; }
.maint-banner { display: flex; gap: 8px; align-items: center; background: var(--crit-mark); color: #fff; font-weight: 600; font-size: .8rem; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.maint-banner .ico { width: 15px; height: 15px; }

/* ---------- Faixa de notícias (estilo telejornal; cores fixas de propósito) ---------- */
.news { border-radius: 6px; overflow: hidden; box-shadow: var(--shadow-lg); font-family: var(--font-text); }
.news-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: stretch; background: #ffffff; min-height: 58px; }
.news-flag { display: grid; place-items: center; padding: 0 18px; background: #c8102e; color: #fff; font-weight: 800; font-size: .95rem; letter-spacing: .06em; text-transform: uppercase; position: relative; }
.news-flag.warn { background: #d97706; }
.news-flag.info, .news-flag.ok { background: #062a57; }
.news-flag::after { content: ""; position: absolute; right: -12px; top: 0; bottom: 0; width: 12px; background: inherit; clip-path: polygon(0 0, 100% 0, 0 100%); }
.news-head { display: flex; flex-direction: column; justify-content: center; padding: 6px 14px 6px 24px; color: #0d0d0d; text-decoration: none; min-width: 0; }
.news-head:hover { text-decoration: none; background: #f6f6f6; }
.news-kicker { font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #c8102e; }
.news-title { font-size: 1.02rem; font-weight: 750; line-height: 1.25; color: #0d0d0d; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news-side { display: flex; align-items: center; gap: 6px; padding: 0 10px; background: #f1f1f1; border-left: 1px solid #ddd; }
.news-live { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #c8102e; }
.news-live i { width: 8px; height: 8px; border-radius: 50%; background: #c8102e; animation: pulsar 1.4s ease-in-out infinite; }
@keyframes pulsar { 50% { opacity: .25; } }
.news-time { font-size: .75rem; color: #444; font-variant-numeric: tabular-nums; white-space: nowrap; }
.news-btn { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid #ccc; background: #fff; color: #222; border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; }
.news-btn:hover { background: #e9e9e9; }
.news-btn .ico { width: 13px; height: 13px; }
.news-ticker { display: flex; align-items: stretch; background: #0e0e0e; color: #fff; height: 32px; }
.news-brand { display: grid; place-items: center; padding: 0 12px; background: #062a57; color: #fff; font-weight: 800; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; box-shadow: inset -3px 0 0 #d4ae3a; }
.news-viewport { overflow: hidden; flex: 1; min-width: 0; display: flex; align-items: center; }
.news-track { display: flex; width: max-content; animation: ticker 70s linear infinite; }
.news:hover .news-track, .news:focus-within .news-track { animation-play-state: paused; }
@keyframes ticker { to { transform: translateX(-50%); } }
.news-run { display: flex; align-items: center; }
.tk-i { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; color: #fff; text-decoration: none; font-size: .8rem; font-weight: 550; white-space: nowrap; }
.tk-i:hover { text-decoration: underline; color: #fff; }
.tk-cat { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: #333; color: #fff; }
.tk-cat.crit { background: #c8102e; } .tk-cat.warn { background: #d97706; } .tk-cat.ok { background: #1d7f46; } .tk-cat.info { background: #1858a8; }
.tk-sep { width: 7px; height: 7px; background: #c8102e; flex: none; }
@media (prefers-reduced-motion: reduce) {
  .news-track { animation: none; } .news-viewport { overflow-x: auto; } .news-run[aria-hidden="true"] { display: none; } .news-live i { animation: none; }
}

/* Faixa no topo da página: ocupa a largura toda, sem cantos */
.main > .news { border-radius: 0; box-shadow: none; border-bottom: 1px solid #000; }
.main > .news .news-top { min-height: 48px; }
.main > .news .news-title { -webkit-line-clamp: 1; font-size: .98rem; }
.main > .news .news-flag { padding: 0 16px; font-size: .86rem; }

/* ---------- Página: como funciona a assinatura ---------- */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; counter-reset: s; }
.step { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); min-width: 0; }
.step:not(:last-child)::after { content: "→"; position: absolute; right: -11px; top: 72px; color: var(--gold); font-weight: 800; z-index: 1; }
.step-n { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.step-ill { height: 128px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); padding: 8px; overflow: hidden; }
.mm { display: flex; flex-direction: column; gap: 5px; font-size: .75rem; color: var(--fg-2); height: 100%; }
.mm-r { display: flex; justify-content: space-between; gap: 4px; align-items: center; padding: 3px 5px; background: var(--surface-2); border-radius: 4px; }
.mm-r i { font-style: normal; font-weight: 700; padding: 1px 5px; border-radius: 3px; font-size: .75rem; color: #fff; }
.mm-ok { background: var(--ok-mark); } .mm-nc { background: var(--crit-mark); } .mm-na { background: #5a6b85; }
.mm-btn { margin-top: auto; background: var(--brand); color: #fff; text-align: center; border-radius: 4px; padding: 4px; font-weight: 700; }
.mm-p { display: flex; gap: 6px; align-items: center; } .mm-p .av { width: 20px; height: 20px; font-size: .75rem; }
.mm-add { margin-top: auto; border: 1px dashed var(--line-strong); border-radius: 4px; text-align: center; padding: 3px; color: var(--info); }
.mm-n { display: flex; gap: 6px; align-items: flex-start; background: var(--surface-2); border-radius: 4px; padding: 5px; } .mm-n .ico { width: 12px; height: 12px; flex: none; color: var(--warn); }
.mm-l { font-weight: 700; } .mm-in { border: 1px solid var(--line-strong); border-radius: 4px; padding: 4px 6px; letter-spacing: .2em; background: var(--surface-2); }
.mm-s { font-size: .75rem; color: var(--fg-3); }
.mm-doc { background: #fff; border-radius: 4px; padding: 6px; position: relative; }
.mm-lines { display: flex; flex-direction: column; gap: 4px; } .mm-lines i { height: 4px; background: #d5dde8; border-radius: 2px; } .mm-lines i.s { width: 60%; }
.mm-sg { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; color: #1d7f46; font-weight: 700; font-size: .75rem; }
.mm-qr { position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; background: repeating-conic-gradient(#062a57 0 25%, #fff 0 50%) 0 0 / 7px 7px; border: 2px solid #062a57; }
.mm-v { display: flex; gap: 6px; align-items: center; color: var(--ok); background: var(--ok-soft); border-radius: 4px; padding: 6px; } .mm-v .ico { width: 14px; height: 14px; }
.mm-code { font-family: var(--font-mono); font-weight: 700; color: var(--fg); font-size: .75rem; }
.seq { width: 100%; min-width: 640px; height: auto; display: block; }
.sq-box { fill: var(--brand-soft); stroke: var(--brand); }
.sq-h { fill: var(--fg); font-size: 11.5px; font-weight: 700; font-family: var(--font-text); }
.sq-life { stroke: var(--line-strong); stroke-dasharray: 4 4; }
.sq-arrow { stroke: var(--fg-2); stroke-width: 1.5; } .sq-arrow.dash { stroke-dasharray: 5 4; }
.sq-head { fill: var(--fg-2); }
.sq-t { fill: var(--fg-2); font-size: 11px; font-family: var(--font-text); }
.sq-self { fill: var(--warn-soft); stroke: var(--warn-mark); }
.rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--fg-2); }

/* ---------- Clique nos gráficos ---------- */
[data-drill] { cursor: pointer; }
.chart [data-drill]:hover, .donut-wrap [data-drill]:hover { opacity: .8; }
.xbar[data-drill]:hover .b, .xbar[data-drill]:hover .sbar { filter: brightness(1.18); }
.xbar[data-drill]:hover .nm { color: var(--fg); text-decoration: underline; }
.sbar i[data-drill]:hover { filter: brightness(1.2); }
.flowrow[data-drill]:hover .nm { color: var(--fg); text-decoration: underline; }
.lad td.clic { cursor: pointer; font-weight: 700; color: var(--info); }
.lad td[data-drill]:hover { background: var(--brand-soft); }
[data-drill]:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ---------- Catálogo de widgets ---------- */
.wcat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.wcat-i { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.wcat-i > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

/* ---------- Perfis ---------- */
.perfis { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.perfil-c { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.perm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.perm { display: flex; gap: 8px; align-items: center; font-size: .84rem; font-weight: 500; color: var(--fg); }
.perm input { width: 16px; height: 16px; }

/* ---------- Agenda ---------- */
.ag-tipos { display: flex; flex-wrap: wrap; gap: 6px; }
.ag-tipo { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 99px; background: var(--surface); color: var(--fg-3); cursor: pointer; font-size: .78rem; font-weight: 600; }
.ag-tipo i { width: 9px; height: 9px; border-radius: 50%; opacity: .45; }
.ag-tipo.on { color: var(--fg); background: var(--surface-2); border-color: var(--brand); }
.ag-tipo.on i { opacity: 1; }
.ag-nav { display: flex; align-items: center; gap: 6px; }
.ag-mes { min-width: 170px; text-align: center; }
.ag-mes::before { display: none !important; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.cal-h { padding: 6px 8px; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.cal-d { min-height: 108px; padding: 4px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; }
.cal-d:nth-child(7n) { border-right: 0; }
.cal-d:hover { background: var(--surface-2); }
.cal-d.out { background: color-mix(in srgb, var(--bg) 60%, var(--surface)); }
.cal-d.out .cal-n { color: var(--fg-3); opacity: .6; }
.cal-n { font-size: .78rem; font-weight: 700; padding: 1px 5px; align-self: flex-start; border-radius: 99px; font-variant-numeric: tabular-nums; }
.cal-d.today .cal-n { background: var(--brand); color: #fff; }
.cal-d.today { box-shadow: inset 0 0 0 2px var(--brand); }
.cal-ev { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--fg); font-size: .75rem; font-weight: 600; padding: 2px 5px; border-radius: 3px; cursor: pointer; min-width: 0; }
.cal-ev span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-ev.late { box-shadow: inset 0 0 0 1px var(--crit-mark); }
.cal-ev:hover { background: color-mix(in srgb, var(--c) 30%, transparent); }
.cal-mais { font-size: .75rem; color: var(--info); font-weight: 600; padding-left: 4px; }
.cal-dots { display: none; gap: 3px; flex-wrap: wrap; padding: 0 4px; }
.cal-dots i { width: 7px; height: 7px; border-radius: 50%; }
.ag-list { display: flex; flex-direction: column; gap: 14px; }
.ag-day { display: flex; flex-direction: column; gap: 4px; }
.ag-dh { font-weight: 700; font-size: .82rem; color: var(--fg-2); text-transform: capitalize; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.ag-day.today .ag-dh { color: var(--info); }
.ag-row { display: grid; grid-template-columns: 52px 4px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%; border: 1px solid transparent; background: none; color: var(--fg); padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.ag-row:hover { background: var(--surface-2); border-color: var(--line); }
.ag-row > i { width: 4px; height: 100%; min-height: 24px; border-radius: 2px; }
.ag-row.compact { grid-template-columns: 42px 4px minmax(0, 1fr); padding: 4px 6px; }
.ag-h { font-size: .75rem; color: var(--fg-3); font-variant-numeric: tabular-nums; font-weight: 600; }
.ag-t { display: flex; flex-direction: column; min-width: 0; }
.ag-t b { font-weight: 600; font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-t small { color: var(--fg-3); font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.ag-mini { display: flex; gap: 6px; align-items: center; font-size: .78rem; color: var(--fg); text-decoration: none; }
.ag-mini i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.ag-mini:hover { text-decoration: underline; }

/* ---------- Resumo do usuário ---------- */
button.avatar { cursor: pointer; padding: 0; font: inherit; font-weight: 700; font-size: .75rem; }
button.avatar:hover, button.avatar[aria-expanded="true"] { background: color-mix(in srgb, var(--gold) 18%, transparent); }
.perfil-pop { position: fixed; z-index: 95; width: min(360px, calc(100vw - 16px)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.pp-head { display: flex; gap: 12px; align-items: center; }
.pp-av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--gold); color: var(--gold); font-weight: 800; flex: none; }
.pp-dl { margin: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.pp-dl div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; font-size: .82rem; }
.pp-dl dt { color: var(--fg-3); }
.pp-dl dd { margin: 0; color: var(--fg); overflow-wrap: anywhere; }
.pp-nums { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pp-nums a { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 8px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--fg-2); text-decoration: none; font-size: .75rem; line-height: 1.2; }
.pp-nums a:hover { border-color: var(--brand); text-decoration: none; }

'use strict';

/* ---------- Data de referência da maquete ---------- */
const HOJE = new Date(2026, 10, 13, 12, 0, 0); // 13/11/2026

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

/* ---------- Ícones (traço único, 24px) ---------- */

  const out = new Set([sigla]);
  let mudou = true;
  while (mudou) {

    for (const a of AREAS) if (a.pai && out.has(a.pai) && !out.has(a.sigla)) { out.add(a.sigla); mudou = true; }

}

      if (!fechado.has(k1)) ir.forEach((i) => { linhas += `<tr class="l2"><td><a href="#${linkItem(i)}"><span class="mono">${i.area}</span> · /${String(i.seq).padStart(2, '0')}</a></td>${celulas([i], { ref: i.ref, area: i.area, nome: i.numero })}</tr>`; });

  const catResp = (i) => (stIdx(i.status) >= 7 || isFinal(i) ? 'ok' : ['respondida_area', 'em_analise_ascoin'].includes(i.status) ? 'asc' : situacao(i).cls === 'vencido' ? 'venc' : i.status === 'devolvida' ? 'dev' : 'pend');

  const blocos = [...new Set(base.map(orgaoDe))].map((o) => {

  const w7 = widget('Status das respostas', `${blocos || '<div class="empty">Sem itens no recorte.</div>'}<div class="legend-dots">${Object.values(CR).map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('')}</div>`, { chips: chipsCtx.slice(0, 1), link: 'pendencias' });

  const comp = [{ label: 'TCE-RJ', v: [24, 19] }, { label: 'CGE-RJ', v: [17, 14] }, { label: 'MPRJ', v: [6, 5] }, { label: 'ALERJ', v: [5, 5] }].map((g) => ({ ...g, drill: { t: `Demandas do ${g.label}`, demOrg: g.label } }));

  // 9. Gravidade
  const gmax = Math.max(1, ...[4, 3, 2, 1].map((g) => abertos.filter((i) => i.grav === g).length));
  const w9 = widget('Pendências por gravidade', `<div class="xbars">${[4, 3, 2, 1].map((g) => { const its = abertos.filter((i) => i.grav === g); const v = its.filter((i) => situacao(i).cls === 'vencido').length; const a = its.filter((i) => situacao(i).cls === 'avencer').length; const o = its.length - v - a; return `<div class="xbar" style="grid-template-columns:minmax(0,70px) minmax(0,1fr)"><span class="nm" style="font-family:var(--font-text)">${GRAV[g]}</span><span class="tr"><span class="sbar" style="height:15px;width:${Math.max(3, (its.length / gmax) * 85)}%;background:transparent">${v ? `<i style="flex:${v};background:var(--crit-mark)" ${dr({ t: `Gravidade ${GRAV[g].toLowerCase()} · vencidas`, grav: g, sit: 'vencido' })} data-tip="${esc(`${GRAV[g]}|${v} vencidas`)}"></i>` : ''}${a ? `<i style="flex:${a};background:var(--warn-mark)" ${dr({ t: `Gravidade ${GRAV[g].toLowerCase()} · a vencer`, grav: g, sit: 'avencer' })} data-tip="${esc(`${GRAV[g]}|${a} a vencer`)}"></i>` : ''}${o ? `<i style="flex:${o};background:var(--s1)" ${dr({ t: `Gravidade ${GRAV[g].toLowerCase()} · demais`, grav: g, sit: 'demais' })} data-tip="${esc(`${GRAV[g]}|${o} demais`)}"></i>` : ''}</span><span class="v">${its.length}</span></span></div>`; }).join('')}</div>

  // 10. Situação do fluxo
  const etapas = STATUS.filter((s) => !s.final);
  const emax = Math.max(1, ...etapas.map((s) => abertos.filter((i) => i.status === s.cod).length));

  const extras = state.extraW.map((k, n) => widgetExtra(k, n, state.extraW.length)).join('');
  return `<h1 class="sr-only">Painel executivo</h1>

  <div class="wgrid">${w11}</div>`;
}

function respostasAplicacao(a) {

  const k = parseInt(a.n, 10);
  return Object.fromEntries(CK_ITENS.map((q) => {
    const r = (q.n * 5 + k * 3) % 13;
    let v = q.n === 8 ? 'nao_se_aplica' : r === 0 ? 'nao_conforme' : r === 1 ? 'com_ressalva' : 'conforme';

}

/* =========================================================================
   FAIXA DE NOTÍCIAS (estilo telejornal) com os principais destaques
   ========================================================================= */
function insights() {
  const u = eu();
  const vis = itensVisiveis(); const ab = vis.filter((i) => !isFinal(i));
  const out = [];
  const minhas = [];
  if (false) out.push({ sev: 'crit', cat: 'Sua assinatura', txt: `${plural(minhas.length, 'parecer aguarda', 'pareceres aguardam')} a sua assinatura: ${minhas.map((r) => r.id).join(', ')}`, link: `relatorio-${minhas[0].id}` });
  const venc = ab.filter((i) => situacao(i).cls === 'vencido').sort((a, b) => a.prazo.localeCompare(b.prazo));
  if (venc.length) out.push({ sev: 'crit', cat: 'Prazos', txt: `${plural(venc.length, 'item vencido', 'itens vencidos')}. ${venc[0].area} está há ${situacao(venc[0]).txt.replace(' em atraso', '')} sem responder: ${venc[0].titulo}`, link: linkItem(venc[0]) });
  const av = ab.filter((i) => situacao(i).cls === 'avencer').sort((a, b) => a.prazo.localeCompare(b.prazo));
  if (av.length) out.push({ sev: 'warn', cat: 'Prazos', txt: `${av[0].area}: “${av[0].titulo}” ${situacao(av[0]).txt} (${fmt(av[0].prazo)})${av.length > 2 ? `. Outros ${av.length - 1} itens vencem nos próximos 5 dias` : av.length === 2 ? '. Outro item vence nos próximos 5 dias' : ''}`, link: linkItem(av[0]) });
  RELATORIOS.filter((r) => situacaoRel(r) === 'aguardando' && !r.substituidoPor).forEach((r) => out.push({ sev: diasAte(prazoSig(r)) < 0 ? 'crit' : 'warn', cat: 'Assinaturas', txt: `${r.id} aguarda ${r.sigs.length - sigsFeitas(r)} de ${r.sigs.length} assinaturas. Vez de ${USER[proximaSig(r).u].nome}, até ${fmt(prazoSig(r))}`, link: `relatorio-${r.id}` }));
  const ciencia = DEMANDAS.filter((d) => podeVerDemanda(d) && itensDaDemanda(d.n).filter((i) => !isFinal(i)).length && itensDaDemanda(d.n).filter((i) => !isFinal(i)).every((i) => i.status === 'consolidada'));
  if (ciencia.length) out.push({ sev: 'warn', cat: 'CHEGAB', txt: `${ciencia.map((d) => `DEM-2026-${d.n}`).join(', ')} ${ciencia.length > 1 ? 'aguardam' : 'aguarda'} a ciência da Chefia de Gabinete`, link: `demanda-${ciencia[0].n}` });
  const sc = ab.filter((i) => diasSemCiencia(i) >= CIENCIA_CFG.chefia);
  if (sc.length) out.push({ sev: 'warn', cat: 'Ciência', txt: `${plural(sc.length, 'item segue', 'itens seguem')} sem ciência da área há ${CIENCIA_CFG.chefia} dias ou mais (${sc.map((i) => i.area).join(', ')}). Chefia avisada`, link: linkItem(sc[0]) });
  const pr = PRORROGACOES.filter((p) => p.status === 'pendente');
  if (pr.length && ['ascoin', 'admin'].includes(u.papel)) out.push({ sev: 'warn', cat: 'Prorrogação', txt: `${plural(pr.length, 'pedido de prorrogação aguarda', 'pedidos de prorrogação aguardam')} decisão da ASCOIN`, link: 'prorrogacoes' });
  const nova = DEMANDAS.filter((d) => podeVerDemanda(d)).sort((a, b) => b.receb.localeCompare(a.receb))[0];
  if (nova) out.push({ sev: 'info', cat: nova.org, txt: `Nova demanda recebida em ${fmt(nova.receb)}: ${nova.assunto}`, link: `demanda-${nova.n}` });
  const nc = APLICACOES.reduce((s, a) => s + contagem(a).nao_conforme, 0);
  out.push({ sev: 'info', cat: 'Conformidade', txt: `${nc} não conformidades apontadas em ${APLICACOES.length} checklists de convênios em 2026`, link: 'checklists' });
  const fin = vis.filter((i) => isFinal(i) && i.status !== 'cancelada');
  if (fin.length) out.push({ sev: 'ok', cat: 'Resultado', txt: `${Math.round((fin.filter((i) => i.status === 'atendida').length / fin.length) * 100)}% das recomendações encerradas foram atendidas`, link: 'painel' });
  const reinc = DEMANDAS.filter((d) => d.reinc && podeVerDemanda(d));
  const temaTop = Object.entries(reinc.reduce((m, d) => ({ ...m, [d.tema]: (m[d.tema] || 0) + 1 }), {})).sort((a, b) => b[1] - a[1])[0];
  if (reinc.length) out.push({ sev: 'info', cat: 'Reincidência', txt: `${plural(reinc.length, 'demanda repete tema', 'demandas repetem temas')} dos últimos 24 meses. Mais frequente: ${temaTop ? temaTop[0] : ''}`, link: 'demandas' });
  const dev = {}; vis.forEach((i) => { dev[i.area] = (dev[i.area] || 0) + i.devol; });
  const topDev = Object.entries(dev).sort((a, b) => b[1] - a[1])[0];
  if (topDev && topDev[1]) out.push({ sev: 'info', cat: 'Qualidade', txt: `${topDev[0]} lidera as devoluções para complementação no ano (${topDev[1]})`, link: 'pendencias' });
  return out;
}
const FLAG = { crit: 'Urgente', warn: 'Atenção', info: 'Destaque', ok: 'Destaque' };
function manchetes() { const ins = insights(); const top = ins.filter((x) => x.sev === 'crit' || x.sev === 'warn'); return top.length ? top : ins; }
function faixaNoticias(compacta = false) {

  if (compacta) return `<section class="news compacta" aria-label="Destaques do sistema"><div class="news-ticker"><span class="news-flag ${h.sev} mini">${FLAG[h.sev]}</span><div class="news-viewport"><div class="news-track"><div class="news-run">${itens}</div><div class="news-run" aria-hidden="true">${itens}</div></div></div><a class="news-mais" href="#painel">Painel</a></div></section>`;
  return `<section class="news" aria-label="Destaques do sistema" data-news>
    <div class="news-top">
      <span class="news-flag ${h.sev}" id="news-flag">${FLAG[h.sev]}</span>
      <a class="news-head" id="news-head" href="#${h.link}" aria-live="polite"><span class="news-kicker">${esc(h.cat)}</span><span class="news-title">${esc(h.txt)}</span></a>
      <div class="news-side"><span class="news-live"><i></i>Ao vivo</span><span class="news-time">13/11 · ${state.newsIdx % mc.length + 1}/${mc.length}</span>
        <button class="news-btn" data-act="news-prev" aria-label="Destaque anterior">‹</button><button class="news-btn" data-act="news-next" aria-label="Próximo destaque">›</button><button class="news-btn" data-act="news-off" aria-label="Ocultar faixa de notícias">${ico('x')}</button></div>
    </div>
    <div class="news-ticker"><span class="news-brand">SisControle</span><div class="news-viewport"><div class="news-track"><div class="news-run">${itens}</div><div class="news-run" aria-hidden="true">${itens}</div></div></div></div>
  </section>`;
}
function atualizarManchete() {
  const el = document.getElementById('news-head'); if (!el) return;
  const mc = manchetes(); const h = mc[state.newsIdx % mc.length];
  const fl = document.getElementById('news-flag'); fl.className = `news-flag ${h.sev}`; fl.textContent = FLAG[h.sev];
  el.href = `#${h.link}`; el.innerHTML = `<span class="news-kicker">${esc(h.cat)}</span><span class="news-title">${esc(h.txt)}</span>`;
  const t = document.querySelector('.news-time'); if (t) t.textContent = `13/11 · ${state.newsIdx % mc.length + 1}/${mc.length}`;
}
setInterval(() => {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const n = document.querySelector('[data-news]');
  if (!n || n.matches(':hover') || n.contains(document.activeElement)) return;
  state.newsIdx++; atualizarManchete();
}, 7000);

function viewRiscos() {
  const cont = { '5-4': 1, '4-4': 2, '4-3': 1, '3-4': 1, '3-3': 3, '2-3': 2, '3-2': 2, '2-2': 4, '1-2': 2, '2-1': 1 };
  const nivel = (p, i) => p * i;
  const cor = (n) => (n >= 15 ? 'var(--crit-mark)' : n >= 8 ? 'var(--serious)' : n >= 4 ? 'var(--warn-mark)' : 'var(--ok-mark)');
  let g = '';
  for (let p = 5; p >= 1; p--) { g += `<div class="ax">${p}</div>`; for (let i = 1; i <= 5; i++) { const c = cont[`${p}-${i}`] || ''; g += `<div class="cell" style="background:${cor(nivel(p, i))};opacity:${c ? 1 : .35}" data-tip="${esc(`Probabilidade ${p} × Impacto ${i} = ${nivel(p, i)}|${c || 0} risco(s)`)}">${c}</div>`; } }
  g += '<div></div>' + [1, 2, 3, 4, 5].map((i) => `<div class="ax">${i}</div>`).join('');
  return `${pageHead('Riscos e controles', 'Fase 2. Metodologia sugerida com base na ISO 31000 e no COSO, a validar quando a política de riscos for aprovada.')}
  <div class="grid g-2">
    <section class="card"><div class="card-head"><h2>Mapa de calor — risco residual</h2><span class="hint">Exemplo ilustrativo</span></div><div class="card-body"><div class="heat" role="img" aria-label="Mapa de calor 5 por 5 de probabilidade e impacto">${g}</div>
      <p class="small muted" style="margin-top:8px">Linhas: probabilidade (1–5). Colunas: impacto (1–5).</p>
      <div class="legend" style="margin-top:8px"><span><i style="background:var(--ok-mark)"></i>Baixo 1–3</span><span><i style="background:var(--warn-mark)"></i>Médio 4–6</span><span><i style="background:var(--serious)"></i>Alto 8–12</span><span><i style="background:var(--crit-mark)"></i>Extremo 15–25</span></div></div></section>
    <section class="card"><div class="card-head"><h2>Como entra no motor</h2></div><div class="card-body" style="display:flex;flex-direction:column;gap:10px">
      <p class="sec">Cada risco é avaliado no nível inerente e, depois dos controles, no residual. Risco residual <b>alto ou extremo</b> sem plano de tratamento gera automaticamente um item de acompanhamento para a área dona do processo.</p>
      <p class="sec">Categorias sugeridas: estratégico, operacional, conformidade, orçamentário-financeiro, integridade e imagem. Faixas, escala e categorias ficam em tabela.</p></div></section>
  </div>`;
}

function toast(msg, i = 'checkc') {
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = `${ico(i)}<span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}
function modal({ title, sub = '', body, ok = 'Confirmar', okClass = 'primary', wide = false, onOk }) {
  fecharModal();
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'overlay';
  ov.innerHTML = `<form class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="m-title" novalidate>
    <div class="modal-head"><div><h2 id="m-title">${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div><button type="button" class="icon-btn" data-act="fechar" aria-label="Fechar">${ico('x')}</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><button type="button" class="btn" data-act="fechar">${ok ? 'Cancelar' : 'Fechar'}</button>${ok ? `<button type="submit" class="btn ${okClass}">${ok}</button>` : ''}</div></form>`;
  document.body.appendChild(ov);
  const f = ov.querySelector('form');
  f.addEventListener('submit', async (e) => { e.preventDefault(); const r = await onOk?.(f); if (r !== false) fecharModal(); });
  ov.addEventListener('click', (e) => { if (e.target === ov) fecharModal(); });
  setTimeout(() => f.querySelector('input:not([type=hidden]),textarea,select')?.focus(), 30);
}
function fecharModal() { document.getElementById('overlay')?.remove(); }
const erroCampo = (f, sel, msg) => { const el = f.querySelector(sel); el.setCustomValidity(msg); el.reportValidity(); el.addEventListener('input', () => el.setCustomValidity(''), { once: true }); return false; };

/* ---------- Assinatura eletrônica simples ---------- */
let ultimaAssinatura = null;
function abrirAssinatura(doc, depois) {
  modal({
    title: 'Assinar documento', sub: `${esc(doc)}. Assinatura eletrônica simples (Lei 14.063/2020): digite sua senha novamente para confirmar a autoria.`, ok: 'Assinar',
    body: `<div class="note small">Signatário: <b>${esc(eu().nome)}</b> · ${esc(eu().cargo)}<br>Login: <span class="mono">${eu().email}</span> · data, hora e IP serão registrados.</div>
      <label class="field"><span>Senha</span><input id="as-senha" type="password" autocomplete="current-password" required></label>`,
    onOk: async (f) => {
      if (!f.querySelector('#as-senha').value) return erroCampo(f, '#as-senha', 'Digite sua senha para assinar.');
      const alfa = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const bloco = () => Array.from({ length: 4 }, () => alfa[Math.floor(Math.random() * alfa.length)]).join('');
      const codigo = `SEDES-${bloco()}-${bloco()}-${bloco()}`;
      let hash = hashFake(codigo + doc);
      try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`${doc}|${codigo}|${eu().email}`)); hash = [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); } catch (e) { /* mantém o hash simulado */ }
      ultimaAssinatura = { codigo, tipo: doc, nome: eu().nome, cargo: eu().cargo, em: '2026-11-13 10:00', hash };
      ASSINATURAS.unshift(ultimaAssinatura);
      depois?.();
      setTimeout(() => mostrarComprovante(ultimaAssinatura), 0);
    },
  });
}
function mostrarComprovante(a) {
  modal({
    title: 'Documento assinado', sub: 'O PDF foi gerado com o código e o QR code no rodapé. O hash abaixo é do arquivo final.', ok: '',
    body: `<div class="sign-box"><canvas id="qr" width="29" height="29" aria-label="QR code ilustrativo"></canvas><div style="min-width:0"><div class="eyebrow">Código de verificação</div><div class="code-big">${a.codigo}</div><div class="mono small muted" style="overflow-wrap:anywhere;margin-top:6px">SHA-256 ${a.hash}</div></div></div>
      <p class="small muted">QR code ilustrativo. Na versão real, ele aponta para verificar.html?codigo=${a.codigo}.</p>
      <div class="actions"><a class="btn" href="#verificar" data-act="ir-verificar" data-cod="${a.codigo}">${ico('shield')}Abrir página de verificação</a><button type="button" class="btn" data-act="exportar" data-fmt="PDF">${ico('download')}Baixar PDF</button></div>`,
  });
  desenharQR(document.getElementById('qr'), a.hash);
}
function desenharQR(cv, hash) {
  const ctx = cv.getContext('2d'); const N = 29;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, N, N); ctx.fillStyle = '#062a57';
  let bits = ''; for (const ch of (hash + hash + hash + hash)) bits += parseInt(ch, 16).toString(2).padStart(4, '0');
  let k = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { if (bits[k++ % bits.length] === '1') ctx.fillRect(x, y, 1, 1); }
  const finder = (ox, oy) => { ctx.fillStyle = '#fff'; ctx.fillRect(ox - 1, oy - 1, 9, 9); ctx.fillStyle = '#062a57'; ctx.fillRect(ox, oy, 7, 7); ctx.fillStyle = '#fff'; ctx.fillRect(ox + 1, oy + 1, 5, 5); ctx.fillStyle = '#062a57'; ctx.fillRect(ox + 2, oy + 2, 3, 3); };
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
}

  const t = e.target.closest?.('[data-tip]');
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.dataset.tip.split('|').map((s, i) => (i === 0 ? `<b>${esc(s)}</b>` : esc(s))).join('<br>') + (t.closest('[data-drill]') ? '<br><i>Clique para ver os itens</i>' : t.matches('.cal-d') ? '<br><i>Clique para abrir o dia</i>' : '');
  tip.classList.toggle('dia', t.matches('.cal-d'));
  tip.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 10);
  tip.style.left = `${x}px`; tip.style.top = `${e.clientY + 14}px`;
});

rota();

</script>
</body>
</html>
